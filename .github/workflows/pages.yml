name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: node --test tests/test_logic.mjs
      - run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Assemble Pages artifact (site files only)
        run: |
          mkdir -p dist/icons dist/assets/vendor/fonts
          cp index.html styles.css app.js logic.js sw.js manifest.webmanifest .nojekyll dist/
          cp icons/icon-192.png icons/icon-512.png dist/icons/
          cp assets/vendor/*.css assets/vendor/*.js assets/vendor/*.md dist/assets/vendor/
          cp assets/vendor/fonts/* dist/assets/vendor/fonts/
          mkdir -p dist/assets/vendor/three
          cp assets/vendor/three/*.js assets/vendor/three/LICENSE dist/assets/vendor/three/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
